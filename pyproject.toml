[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "big_data_project"
version = "0.1.0"
dependencies = [
    "datasketch>=2.0.0",
    "faiss-cpu>=1.5.3",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.0",
    "sodapy>=2.2.0",
    "wordcloud>=1.9.4"
]

[project.optional-dependencies]
dev = [
    "pytest",
]